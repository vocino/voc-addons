name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-check

      - name: checks self-test
        run: bash checks/self-test.sh

      - name: template scaffolds a passing addon
        run: |
          tools/new-addon VocSample vs /tmp/sample
          cd /tmp/sample
          lua5.1 tests/run.lua
          luacheck .
          bash "$GITHUB_WORKSPACE/checks/run-all.sh" .
          curl -sSL -o /tmp/wowlua_ls https://github.com/TradeSkillMaster/wowlua-ls/releases/download/v0.35.0/wowlua_ls-x86_64-unknown-linux-gnu
          chmod +x /tmp/wowlua_ls
          /tmp/wowlua_ls check . --severity warning
